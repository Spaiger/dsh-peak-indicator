# Verify the plugin the way a consumer would: install, typecheck, build both
# halves, run the suites (including the spec that executes the built browser
# bundle), and render-check the standalone demo page.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The repo .npmrc carries legacy-peer-deps: the DSH alpha line has an
      # unresolvable cordis peer conflict, and CI must reproduce user installs.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (node half + browser bundle + declarations)
        run: npm run build

      - name: Test (85 specs, incl. the built-bundle contract)
        run: npm run test:unit

      - name: Demo render check
        run: npm run demo
